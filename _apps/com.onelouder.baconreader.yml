fullDescription: |-
  WARNING: This app was patched by These_Airline_4279 on Reddit, and needs Wolfius to work properly.

  Rated as the Best Reddit App🏆 by Android Authority, BaconReader is trusted🙌 by over 5 million Redditors. BaconReader is the Easiest and most Intuitive way to Reddit for Power Users, Casual Users and Moderators. BaconReader is the first and only app with a step-by-step guide to the world of reddit! Enjoy the Original Reddit App Experience with BaconReader.

  BaconReader lets you enjoy all of the best content on reddit - writing prompts, r/politics, funny or weird news. Access news and entertainment content, post links, pics & comments, upvote and downvote to your heart’s content. So what are you waiting for? Download the app right now from your Android phone or tablet and earn karma. Now featuring a brand-new material design interface and a comprehensive list of features, stay informed and entertained in the tastiest reddit app available.

  THE TASTY FEATURES:

  📲Beautiful Material Design Interface
  🌈Color-coded comment threads
  🎨Draw mode with meme creator for creating original content or modifying images
  👉👈Multi-Mode View: List view and card view
  🏷️Set user and link Flair via the app
  📤Upload images in comments
  📱AMOLED Themes with light, dark, and black backgrounds
  🗛Multiple font sizes ranging from extra small to huge
  🏆Full user profile support including trophy case
  ⚙️Moderator tools: modmail, spam, removal/approval
  🔧Format toolbar (bold, italic, etc.)
  📱Multiple widgets: rotate, scroll, subreddit
  📩Full-featured inbox with orange envelope indicator
  🔓Discover something new with “random” subreddit feature
  🔍Comprehensive search: this subreddit, all posts, for a sub, for a user
  ⭐Advanced filtering: domain, keyword, NSFW, subreddit
  🔖Spoiler tag support for standard CSS subs
  🥇Reddit Gold: Give gold on posts and comments, My Random, full subscribed subreddit list, no ads
  🔑Secure login via Reddit OAUTH
  📂Multiple account and Multireddit support
  🎂Cakeday notification

  NEED HELP?

  Need help with BaconReader? Visit reddit.com/r/baconreader to report bugs and give us feedback.We have been around a long time and always looking to bring new features for users so that they can earn more reddit karma.

  Note: We may collect information from your use of the app that we may share with our partners to deliver personalized ads and improve our services. This data may be associated with other data collected from your visits over time and across different applications and websites to provide you with relevant and useful advertising.

  You may modify your choices at any time as explained in our Privacy Policy: baconreader.com/privacy/#rights

