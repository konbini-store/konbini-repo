name: Doodle Jump SpongeBob SquarePants
author: Nickelodeon
category: arcade
description: A special version of the classic mobile game Doodle Jump with a SpongeBob theme.
fullDescription: |-
  Jump into the most hilariously addictive game ever with all-new Doodle Jump SpongeBob!

  The diabolical Plankton and his jailhouse crew have stolen the Krabby Patty Secret Formula! With Doodle Jump SpongeBob, jump up and across Bikini Bottom, blast bubbles at baddies, and restore order to the sea.

  FEATURES:
  • Four iconic undersea worlds to explore
  • Five endless modes - complete worlds to unlock them all
  • All-new incredible power-ups
  • Exciting and unexpected platforms
  • Friendly faces (Patrick, Sandy, etc.) provide a helping hand
  • Infamous villains (Man Ray, Dirty Bubble, etc.) to defeat
  • Daily rewards
  • Daily and weekly challenges
  • Leaderboards
  • Achievements

  HOW TO PLAY:
  • Tilt to move left or right
  • Tap the screen to shoot

  ___________________________
  ADDITIONAL NOTES: Doodle Jump SpongeBob offers in-app purchases and charges real money for additional in-app content. You may lock out the ability to purchase in-app content by adjusting your device’s settings.


  Doodle Jump SpongeBob collects personal user data as well as non-personal user data (including aggregated data). User data collection is in accordance with applicable law, such as COPPA. User data may be used, for example, to respond to user requests; enable users to take advantage of certain features and services; personalize content and advertising; and manage and improve Nickelodeon's services. For more information regarding Nickelodeon’s use of personal user data, please visit the Nickelodeon Group Privacy Policy below. Our Privacy Policy is in addition to any terms, conditions or policies agreed to between you and Google, Inc., and Nickelodeon and its affiliated entities are not responsible for Google's collection or use of your personal user data and information. Use of this app is subject to the Nickelodeon End User License Agreement. For users residing in the EU, Doodle Jump SpongeBob may include the use of persistent identifiers for game management purposes and installation of this app constitutes your permission to such usage of persistent identifiers for all users on your device.

