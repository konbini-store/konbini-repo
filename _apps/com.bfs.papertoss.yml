name: Paper Toss
author: Backflip Studios
description: Toss the Paper
category: arcade
fullDescription: |-
  Have you ever been bored at work, crumpled up a piece of paper and counted how many times you can make it in a small trash can?
  Has your boss ever gone out for a quick bite while you and your co-workers see how far you can move the trash can away and still make the paper shot?
  Have you ever brought in electric fans to make the shot even harder?
  Backflip Studios is happy to announce that we have brought this amazing and hilarious experience to the Android.

  This game is oddly satisfying . . . much like tossing a real ball of crumpled paper into a metal trash basket.
  So realistic, you will think you are stuck in an office killing time.

  Game includes:
  -Gorgeous graphics
  -8 levels of varied difficulty
  -Innovative flick control
  -Animated paper
  -Real office sounds
  -Varying wind speed from fan impacts paper flight
  -Verbal abuse from angry co-workers

  Let us know what you think.

