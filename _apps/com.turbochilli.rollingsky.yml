name: Rolling Sky
author: Turbo Chilli
description: An astonishing arcade game.
category: adventure
fullDescription: |-
  You play as a ball which is rolling over the jungle or sea, just listen carefully to the Magic Play Music and take the ball through the amazing Maze. Just Tap the screen and ZigZag the ball. Trust your Skillful ears and Finger rather your eyes to dancing sky Line and ZigZag the Ball to avoids obstacles. the splendid 3D effect scene enables you to experience the imaginary traps and barriers, a casual and addictive rolling ball game scrolling in sky and pushes the boundaries of your speed and reaction.

  As an addictive arcade jump ball rider just like the rolling stone, and the tense rhythm will make you forget the time! test your finger speed and response to the limit of the game, that’s the magic of rolling dream ball!
  Listen to the music beat and use your musical reflexes to move the rolling ball left or right and follow the line to guide the ball from tiles to tiles, in short make the ball zigzag in the sky, and try not to fall off the sky, rush and jump with rolling bouncy ball while dodging hurdles and passing through obstacle, beating your own score and hit checkpoints.
  Just follow the rhythm and do not miss the path to bounce the rolling ball! Make insane combos and beat your friend's scores when you move the ball to clear tower level! Like Dancing Line

  Gameplay is very simple, but difficult to pass!throw ball left or right, or hit to jump ball to avoid hitting a variety of sudden obstacles whem listening to dynamic and tasteful music, concentrate to increase your speed and passion.
  Run triply balls and tighten your nerves on rolling ballz and avoid trapping in universe!

  Game Play :
  -Easy gameplay, tap screen , react then dance with the ball ! you can even play with eyes closed! This amusement will take you to various adventures, you'll grow with the game as well! Go ahead!
  - Tap screen to move the ball among various adventures and follow the rhythm and do not miss the path to bounce the rolling sky ball! Make insane combos and beat your friend's scores when you move the ball to clear tower level!
  - So don't miss the chance to beat and Tap the Dancing Ball with the music around to reach the Final Temple.

  Game Features :
  - Real Amazing Graphics
  - Different colorful balls to play with
  - Amazing soft music : piano, jungle sounds etc
  - Unlock Awesome Puzzle Worlds
  - Endless adventure zigzag game
  - Rolling ball adventure
  - Colorful graphics!
  - Challenge players world wide!
  - One-touch control with simple operations
  - Unlock Awesome Worlds in amazing graphics and Puzzle Fun Challenges
  - Overcome diffrent types of obstacles
  - 3D physical environment and moderate music
  - The music guide your tapping and dancing. don't fall down
  - Multiple music Rhythm like Guitar. Piano, Drum
  - Perfect colors of Rolling Sky

  finally use your Skillful eyes and Finger to guide and Tap the Ball and enjoy the journey with variety of sounds, Play Rolling Sky now.

