name: Tiny Music Player
package: com.martinmimigames.tinymusicplayer
author: MGGames
description: A mini, simple, yet compatible notification-based audio player.
category: music
fullDescription: |-
  Plays audios and videos, like how you expected to.
  How small? Less than 20 KB.
  Designed in hope for compatibility with different android versions.
  Open-sourced and publicly-viewable code for anyone worrying about being locked in or privacy invasion.
  Supports Android 1.0+
  For Android 13+, notification permission needs to be granted to work properly.
  This is a tinier branch from Little Music Player, with only basic functionality to reduce size.
  Source code at GitHub.
  Newest version: v1.3 (Updated on 04/02/2023)

  === Update Log ===
  v1.3:
  - Added Loop function (accessible via the notifications)
  - Cleaner Notification Category descriptions
  v1.2:
  - fixed not having permission to open audios on older android (read permission)
  - fixed notification not disappearing when player failed to start
  - more time to read error message
  - fixed incorrect results checking for opening files
  - updated notification looks to blend in more correctly
  - updated description
  - reduced app size
  v1.1:
  - fixed double opening file explorer
  - changed logo icon
  - reduced app size
  v1.0:
  - 1st release

icon: "http://konbini.lol/resources/com.martinmimigames.tinymusicplayer/icon.png"
versions:
  - "http://konbini.lol/resources/com.martinmimigames.tinymusicplayer/versions/1.3.apk"
      